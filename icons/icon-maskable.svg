<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="RepoVault maskable icon">
  <title>RepoVault (maskable)</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc14d"/>
      <stop offset="0.55" stop-color="#ff8a00"/>
      <stop offset="1" stop-color="#ff4d00"/>
    </linearGradient>
  </defs>
  <!-- full-bleed background: Android crops this to a circle/squircle, so the art
