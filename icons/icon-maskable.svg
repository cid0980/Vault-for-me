  <g transform="translate(256 256) scale(0.72) translate(-256 -256)">
    <rect x="96" y="86" width="320" height="340" rx="44" fill="none" stroke="url(#g)" stroke-width="30"/>
    <circle cx="256" cy="256" r="62" fill="none" stroke="url(#g)" stroke-width="28"/>
    <circle cx="256" cy="256" r="16" fill="url(#g)"/>
    <path d="M256 158v36M256 318v36M158 256h36M318 256h36" stroke="url(#g)" stroke-width="24" stroke-linecap="round"/>
  </g>
</svg>
